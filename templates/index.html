<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Palette Curve Lab</title>
<style>
:root{
  --bg:#f5f7fb;
  --panel:#fff;
  --text:#111827;
  --muted:#6b7280;
  --border:#e5e7eb;
  --soft:#f8fafc;
  --accent:#105CF4;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);
  background:var(--bg);
}
.shell{max-width:1440px;margin:0 auto;padding:28px}
.hero{
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px
}
h1{font-size:28px;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:360px 1fr;gap:20px}
.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:16px;
  box-shadow:0 1px 2px rgba(16,24,40,.03)
}
.left{padding:18px}
.right{padding:20px}
.section-title{font-size:14px;font-weight:700;margin:0 0 14px}
.swatch-row{
  display:grid;grid-template-columns:52px 44px 1fr;align-items:center;gap:10px;
  padding:7px 0;border-bottom:1px solid #f1f3f5
}
.swatch-row:last-child{border-bottom:0}
.level{font-size:12px;color:var(--muted);font-weight:700}
.chip{width:44px;height:34px;border-radius:8px;border:1px solid rgba(0,0,0,.08)}
.hex-wrap{position:relative;width:100%}
.hex-wrap::before{
  content:"#";position:absolute;left:10px;top:50%;transform:translateY(-50%);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
  color:var(--muted);pointer-events:none;z-index:1
}
.hex-input{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 10px 9px 24px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;outline:none
}
.hex-input:focus{border-color:#9db9ff;box-shadow:0 0 0 3px rgba(16,92,244,.08)}
.actions{display:flex;gap:8px;margin-top:14px}
button{
  border:1px solid var(--border);background:#fff;border-radius:9px;padding:9px 12px;
  cursor:pointer;font-weight:600
}
button.primary{background:var(--accent);color:white;border-color:var(--accent)}
.palette-strip{
  display:grid;grid-template-columns:repeat(10,1fr);height:88px;border-radius:12px;
  overflow:hidden;border:1px solid var(--border);margin-bottom:18px
}
.palette-cell{display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:10px;cursor:pointer;transition:filter .15s;position:relative}
.palette-cell:hover{filter:brightness(1.08)}
.palette-cell b{font-size:11px}
.palette-cell .copied-tip{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(0,0,0,.75);color:#fff;padding:4px 10px;border-radius:6px;
  font-size:11px;font-weight:700;pointer-events:none;white-space:nowrap;
  opacity:0;transition:opacity .2s
}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{
  border:1px solid var(--border);padding:8px 12px;border-radius:999px;font-size:12px;
  color:var(--muted);cursor:pointer;background:white
}
.tab.active{background:#111827;color:white;border-color:#111827}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chart-card{
  border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff
}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chart-title{font-size:13px;font-weight:700}
.range{font-size:11px;color:var(--muted)}
svg{width:100%;height:210px;display:block}
.table-wrap{margin-top:18px;overflow:auto;border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:10px 12px;border-bottom:1px solid #eef0f3;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{background:#fafbfc;color:#4b5563;position:sticky;top:0}
.badge{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.note{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.6}

/* ===== 模式切换 ===== */
.mode-switch{
  display:inline-flex;border:1px solid var(--border);border-radius:999px;
  overflow:hidden;background:#fff
}
.mode-switch button{
  border:0;border-radius:0;padding:8px 16px;font-size:13px;font-weight:600;
  color:var(--muted);background:transparent;cursor:pointer
}
.mode-switch button.active{background:var(--accent);color:#fff}

/* ===== 品牌色模式 ===== */
.brand-block{display:none}
.brand-block.show{display:block}
.standard-block.hide{display:none}
.brand-input-row{
  display:grid;grid-template-columns:52px 44px 1fr;align-items:center;gap:10px;
  padding:7px 0;border-bottom:1px solid #f1f3f5
}
.brand-status{
  margin-top:12px;padding:10px 12px;border-radius:8px;font-size:12px;
  background:var(--soft);color:var(--muted);border:1px solid var(--border);
  min-height:20px
}
.brand-status.error{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.brand-status.loading{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.brand-status.success{background:#f0fdf4;color:#166534;border-color:#bbf7d0}

/* ===== 应用预览 ===== */
.preview-section{margin-top:18px}
.preview-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview-card{
  border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff
}
.preview-card-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px}

/* 窗口预览 */
.win-mock{
  border-radius:8px;overflow:hidden;border:1px solid var(--border);
  display:flex;flex-direction:column;height:260px
}
.win-titlebar{
  height:28px;display:flex;align-items:center;padding:0 10px;gap:6px;
  border-bottom:1px solid var(--border)
}
.win-dot{width:8px;height:8px;border-radius:50%}
.win-body{display:flex;flex:1;min-height:0}
.win-sidebar{
  width:80px;padding:8px 6px;display:flex;flex-direction:column;gap:5px;
  border-right:1px solid var(--border)
}
.win-nav-item{
  height:22px;border-radius:5px;padding:0 6px;display:flex;align-items:center;gap:5px
}
.win-nav-icon{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.win-nav-bar{flex:1;height:7px;border-radius:3px}
.win-main{flex:1;padding:10px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.win-heading{height:13px;width:45%;border-radius:3px}
.win-text-line{height:7px;border-radius:3px}
.win-text-line.short{width:55%}
.win-text-line.medium{width:75%}
.win-text-line.full{width:100%}
.win-cards{display:flex;gap:6px;margin-top:2px}
.win-mini-card{
  flex:1;border-radius:5px;padding:6px;display:flex;flex-direction:column;gap:4px
}
.win-mini-bar{height:6px;border-radius:2px}
.win-action{height:22px;width:64px;border-radius:6px;margin-top:auto}

/* 按钮预览 */
.btn-preview-list{display:flex;flex-direction:column;gap:12px}
.btn-row{display:flex;align-items:center;gap:10px}
.btn-row-label{font-size:11px;color:var(--muted);width:36px;flex-shrink:0;text-align:right}
.demo-btn{
  border:none;border-radius:8px;padding:9px 18px;font-size:12px;font-weight:600;
  cursor:pointer;transition:background .15s,color .15s;outline:none
}
.demo-btn.disabled{cursor:not-allowed;opacity:.55}
.btn-state-info{font-size:10px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<div class="shell">
  <div class="hero">
    <div>
      <h1>Palette Curve Lab</h1>
      <div class="sub" id="subTitle">输入 C10 → C1 的 HEX，实时查看 LCH 与 HSL 曲线。</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="/" style="font-size:13px;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:6px;">← 首页</a>
      <div class="mode-switch">
        <button id="modeStandard" class="active">标准模式</button>
        <button id="modeBrand">品牌色生成</button>
      </div>
    </div>
  </div>

  <div class="grid">
    <aside class="panel left">
      <!-- 标准模式：C10 → C1 全部可输入 -->
      <div class="standard-block" id="standardBlock">
        <div class="section-title">标准色卡输入</div>
        <div id="inputs"></div>
        <div class="actions">
          <button class="primary" id="loadBlue">载入品牌色</button>
          <button id="clearAll">清空</button>
        </div>
        <div class="note">
          输入框已固定 <b>#</b> 前缀，只需输入 6 位 HEX。<br>
          LCH 使用 CIE Lab → LCH(ab)，HSL 使用标准 sRGB HSL。
        </div>
      </div>

      <!-- 品牌色模式：只输入 C6，自动生成全套 -->
      <div class="brand-block" id="brandBlock">
        <div class="section-title">品牌色输入（C6）</div>
        <div class="brand-input-row">
          <div class="level">C6</div>
          <div class="chip" id="brandChip"></div>
          <div class="hex-wrap">
            <input class="hex-input" id="brandHex" value="005AEB" maxlength="6" />
          </div>
        </div>
        <div class="actions">
          <button class="primary" id="brandGenerate">生成色板</button>
          <button id="brandReset">重置</button>
        </div>
        <div class="brand-status" id="brandStatus">
          输入 C6 品牌色，点击「生成色板」或回车即可自动生成 C10 → C1。
        </div>
      </div>
    </aside>

    <main class="panel right">
      <div class="palette-strip" id="paletteStrip"></div>

      <div class="tabs">
        <button class="tab active" data-mode="LCH">LCH</button>
        <button class="tab" data-mode="HSL">HSL</button>
        <button class="tab" data-mode="ALL">全部</button>
      </div>

      <div class="cards" id="charts"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Level</th><th>HEX</th>
              <th>L*</th><th>C*</th><th>H° (LCH)</th>
              <th>H° (HSL)</th><th>S%</th><th>L% (HSL)</th>
            </tr>
          </thead>
          <tbody id="dataRows"></tbody>
        </table>
      </div>

      <div class="preview-section">
        <div class="section-title">应用预览</div>
        <div class="preview-cards">
          <div class="preview-card">
            <div class="preview-card-label">窗口效果预览</div>
            <div class="win-mock" id="winMock"></div>
          </div>
          <div class="preview-card">
            <div class="preview-card-label">按钮交互预览</div>
            <div class="btn-preview-list" id="btnPreviewList"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
const LEVELS = ["C10","C9","C8","C7","C6","C5","C4","C3","C2","C1"];
const DEFAULT_PALETTE = [
  "#001A4A","#052464","#073896","#034dcc","#005AEB",
  "#1272f4","#6096fa","#9EBEFB","#D0DFFC","#E8F0FE"
];
let mode = "LCH";
let appMode = "standard"; // "standard" | "brand"

function clamp(v,min,max){return Math.min(max,Math.max(min,v));}
function validHex(v){return /^[0-9a-fA-F]{6}$/.test(v.trim().replace("#",""));}
function hexToRgb(hex){
  hex=hex.replace("#","");
  return [
    parseInt(hex.slice(0,2),16)/255,
    parseInt(hex.slice(2,4),16)/255,
    parseInt(hex.slice(4,6),16)/255
  ];
}
function srgbToLinear(c){
  return c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4);
}
function rgbToXyz(rgb){
  let [r,g,b]=rgb.map(srgbToLinear);
  return [
    (0.4124564*r + 0.3575761*g + 0.1804375*b)*100,
    (0.2126729*r + 0.7151522*g + 0.0721750*b)*100,
    (0.0193339*r + 0.1191920*g + 0.9503041*b)*100
  ];
}
function xyzToLab(xyz){
  const Xn=95.047, Yn=100.000, Zn=108.883;
  let [x,y,z]=[xyz[0]/Xn,xyz[1]/Yn,xyz[2]/Zn];
  const d=6/29;
  function f(t){return t>Math.pow(d,3)?Math.cbrt(t):(t/(3*d*d)+4/29);}
  let fx=f(x),fy=f(y),fz=f(z);
  return [116*fy-16, 500*(fx-fy), 200*(fy-fz)];
}
function labToLch(lab){
  const [L,a,b]=lab;
  const C=Math.sqrt(a*a+b*b);
  let H=Math.atan2(b,a)*180/Math.PI;
  if(H<0)H+=360;
  return [L,C,H];
}
function hexToLch(hex){return labToLch(xyzToLab(rgbToXyz(hexToRgb(hex))));}
function rgbToHsl(rgb){
  let [r,g,b]=rgb;
  let max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0,s=0,l=(max+min)/2;
  let d=max-min;
  if(d!==0){
    s=d/(1-Math.abs(2*l-1));
    switch(max){
      case r:h=60*(((g-b)/d)%6);break;
      case g:h=60*(((b-r)/d)+2);break;
      case b:h=60*(((r-g)/d)+4);break;
    }
    if(h<0)h+=360;
  }
  return [h,s*100,l*100];
}
function textColorFor(hex){
  let [r,g,b]=hexToRgb(hex);
  let lum=.2126*r+.7152*g+.0722*b;
  return lum<.56?"#fff":"#111";
}
function copyToClipboard(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  }else{
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta=document.createElement("textarea");
  ta.value=text;
  ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);
}
function currentColors(){
  return LEVELS.map((_,i)=>{
    const v=document.getElementById("hex"+i).value.trim().replace("#","");
    return validHex(v)?("#"+v.toUpperCase()):null;
  });
}
function computeData(){
  return currentColors().map((hex,i)=>{
    if(!hex) return {level:LEVELS[i],hex:null};
    const lch=hexToLch(hex), hsl=rgbToHsl(hexToRgb(hex));
    return {level:LEVELS[i],hex,lch,hsl};
  });
}
function buildInputs(){
  const el=document.getElementById("inputs");
  el.innerHTML="";
  LEVELS.forEach((level,i)=>{
    const row=document.createElement("div");
    row.className="swatch-row";
    row.innerHTML=`
      <div class="level">${level}</div>
      <div class="chip" id="chip${i}"></div>
      <div class="hex-wrap">
        <input class="hex-input" id="hex${i}" value="${DEFAULT_PALETTE[i].replace('#','')}" maxlength="6" />
      </div>
    `;
    el.appendChild(row);
    const inp=row.querySelector("input");
    inp.addEventListener("input",()=>{
      inp.value=inp.value.replace(/[^0-9a-fA-F]/g,'').toUpperCase().slice(0,6);
      render();
    });
  });
}
function drawChart(container,title,values,labels,unit,fixedRange){
  const valid=values.map((v,i)=>({v,i})).filter(x=>Number.isFinite(x.v));
  const w=520,h=210,pL=38,pR=14,pT=18,pB=30;
  let min,max;
  if(fixedRange){
    min=fixedRange[0];
    max=fixedRange[1];
  }else{
    min=valid.length?Math.min(...valid.map(x=>x.v)):0;
    max=valid.length?Math.max(...valid.map(x=>x.v)):1;
    if(max===min){max=min+1;}
    const pad=(max-min)*.12;
    min-=pad;max+=pad;
  }
  const x=i=>pL+(w-pL-pR)*(i/(labels.length-1));
  const y=v=>pT+(h-pT-pB)*(1-(v-min)/(max-min));
  const pts=valid.map(xv=>`${x(xv.i)},${y(xv.v)}`).join(" ");
  let circles=valid.map(xv=>`
    <circle cx="${x(xv.i)}" cy="${y(xv.v)}" r="4" fill="#111827"/>
    <text x="${x(xv.i)}" y="${y(xv.v)-9}" text-anchor="middle" font-size="10" fill="#6b7280">${xv.v.toFixed(1)}</text>
  `).join("");
  let xlabels=labels.map((lab,i)=>`<text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="10" fill="#6b7280">${lab}</text>`).join("");
  let grid=[0,.25,.5,.75,1].map(t=>{
    const yy=pT+(h-pT-pB)*t;
    const vv=max-(max-min)*t;
    return `<line x1="${pL}" y1="${yy}" x2="${w-pR}" y2="${yy}" stroke="#eef0f3"/>
            <text x="${pL-6}" y="${yy+3}" text-anchor="end" font-size="9" fill="#9ca3af">${vv.toFixed(0)}</text>`;
  }).join("");
  container.innerHTML=`
    <div class="chart-head"><div class="chart-title">${title}</div><div class="range">${unit}</div></div>
    <svg viewBox="0 0 ${w} ${h}">
      ${grid}
      <polyline points="${pts}" fill="none" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      ${circles}${xlabels}
    </svg>
  `;
}
function render(){
  const data=computeData();

  data.forEach((d,i)=>{
    const chip=document.getElementById("chip"+i);
    chip.style.background=d.hex||"#fff";
  });

  const strip=document.getElementById("paletteStrip");
  strip.innerHTML=data.map(d=>{
    const bg=d.hex||"#fff",tc=d.hex?textColorFor(d.hex):"#999";
    return `<div class="palette-cell" style="background:${bg};color:${tc}" data-hex="${d.hex||''}">
      <b>${d.level}</b><span>${d.hex||"—"}</span>
    </div>`;
  }).join("");

  // 点击色板单个颜色复制 HEX（含 #）
  strip.querySelectorAll(".palette-cell").forEach(cell=>{
    const hex=cell.dataset.hex;
    if(!hex)return;
    cell.title="点击复制 "+hex;
    cell.addEventListener("click",()=>{
      copyToClipboard(hex);
      let tip=cell.querySelector(".copied-tip");
      if(!tip){
        tip=document.createElement("div");
        tip.className="copied-tip";
        tip.textContent="已复制 "+hex;
        cell.appendChild(tip);
      }
      tip.textContent="已复制 "+hex;
      tip.style.opacity="1";
      clearTimeout(cell._copyTimer);
      cell._copyTimer=setTimeout(()=>{tip.style.opacity="0";},800);
    });
  });

  const rows=document.getElementById("dataRows");
  rows.innerHTML=data.map(d=>{
    if(!d.hex)return `<tr><td>${d.level}</td><td>—</td><td colspan="6">Invalid HEX</td></tr>`;
    return `<tr>
      <td><b>${d.level}</b></td><td class="badge">${d.hex}</td>
      <td>${d.lch[0].toFixed(3)}</td><td>${d.lch[1].toFixed(3)}</td><td>${d.lch[2].toFixed(3)}</td>
      <td>${d.hsl[0].toFixed(3)}</td><td>${d.hsl[1].toFixed(3)}</td><td>${d.hsl[2].toFixed(3)}</td>
    </tr>`;
  }).join("");

  const specs=[];
  if(mode==="LCH"||mode==="ALL"){
    specs.push(["LCH · Lightness",data.map(d=>d.lch?.[0]),"L*",[0,100]]);
    specs.push(["LCH · Chroma",data.map(d=>d.lch?.[1]),"C*",null]);
    specs.push(["LCH · Hue",data.map(d=>d.lch?.[2]),"degree",[0,360]]);
  }
  if(mode==="HSL"||mode==="ALL"){
    specs.push(["HSL · Hue",data.map(d=>d.hsl?.[0]),"degree",[0,360]]);
    specs.push(["HSL · Saturation",data.map(d=>d.hsl?.[1]),"%",[0,100]]);
    specs.push(["HSL · Lightness",data.map(d=>d.hsl?.[2]),"%",[0,100]]);
  }
  const charts=document.getElementById("charts");
  charts.innerHTML="";
  specs.forEach(([title,values,unit,fixedRange])=>{
    const card=document.createElement("div");
    card.className="chart-card";
    charts.appendChild(card);
    drawChart(card,title,values,LEVELS,unit,fixedRange);
  });

  renderPreviews();
}

/* ===== 模式切换 ===== */
function setAppMode(m){
  appMode=m;
  const stdBtn=document.getElementById("modeStandard");
  const brdBtn=document.getElementById("modeBrand");
  const stdBlock=document.getElementById("standardBlock");
  const brdBlock=document.getElementById("brandBlock");
  const subTitle=document.getElementById("subTitle");

  if(m==="brand"){
    stdBtn.classList.remove("active");
    brdBtn.classList.add("active");
    stdBlock.classList.add("hide");
    brdBlock.classList.add("show");
    subTitle.textContent="输入 C6 品牌色，算法自动生成 C10 → C1 完整色板。";
    updateBrandChip();
  }else{
    brdBtn.classList.remove("active");
    stdBtn.classList.add("active");
    brdBlock.classList.remove("show");
    stdBlock.classList.remove("hide");
    subTitle.textContent="输入 C10 → C1 的 HEX，实时查看 LCH 与 HSL 曲线。";
    render();
  }
}

document.getElementById("modeStandard").addEventListener("click",()=>setAppMode("standard"));
document.getElementById("modeBrand").addEventListener("click",()=>setAppMode("brand"));

/* ===== 标准模式按钮 ===== */
document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    tab.classList.add("active");
    mode=tab.dataset.mode;
    render();
  });
});
document.getElementById("loadBlue").addEventListener("click",()=>{
  DEFAULT_PALETTE.forEach((v,i)=>document.getElementById("hex"+i).value=v.replace("#",""));
  render();
});
document.getElementById("clearAll").addEventListener("click",()=>{
  LEVELS.forEach((_,i)=>document.getElementById("hex"+i).value="");
  render();
});

/* ===== 品牌色模式 ===== */
function setBrandStatus(text,type){
  const el=document.getElementById("brandStatus");
  el.textContent=text;
  el.className="brand-status"+(type?(" "+type):"");
}
function updateBrandChip(){
  const v=document.getElementById("brandHex").value.trim().replace("#","");
  const chip=document.getElementById("brandChip");
  if(validHex(v)){
    chip.style.background="#"+v;
  }else{
    chip.style.background="#fff";
  }
}

async function generateFromBrand(){
  const raw=document.getElementById("brandHex").value.trim().replace("#","");
  if(!validHex(raw)){
    setBrandStatus("请输入合法的 #RRGGBB 颜色","error");
    return;
  }
  const color="#"+raw;
  setBrandStatus("正在生成色板…","loading");

  try{
    const resp=await fetch("/api/generate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({color:color})
    });
    const data=await resp.json();
    if(!resp.ok){
      setBrandStatus("生成失败："+(data.error||"未知错误"),"error");
      return;
    }

    // data.palette 是 C10 → C1 的 10 个 HEX
    // 填入标准输入框（这样 render 能正确显示）
    const palette=data.palette||[];
    LEVELS.forEach((_,i)=>{
      const hex=(palette[i]||"").replace("#","");
      document.getElementById("hex"+i).value=hex;
    });
    render();
    setBrandStatus("已根据 C6 = "+color.toUpperCase()+" 生成完整色板。","success");
  }catch(e){
    setBrandStatus("网络错误："+e.message,"error");
  }
}

document.getElementById("brandHex").addEventListener("input",(e)=>{
  e.target.value=e.target.value.replace(/[^0-9a-fA-F]/g,'').toUpperCase().slice(0,6);
  updateBrandChip();
});
document.getElementById("brandHex").addEventListener("keydown",(e)=>{
  if(e.key==="Enter"){e.preventDefault();generateFromBrand();}
});
document.getElementById("brandGenerate").addEventListener("click",generateFromBrand);
document.getElementById("brandReset").addEventListener("click",()=>{
  document.getElementById("brandHex").value="005AEB";
  updateBrandChip();
  DEFAULT_PALETTE.forEach((v,i)=>document.getElementById("hex"+i).value=v.replace("#",""));
  setBrandStatus("已重置为默认品牌色。","");
  render();
});
